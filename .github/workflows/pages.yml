name: Publish the viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

# The viewer is a static page reading committed run records, so publishing is a
# copy — no build, no bundler, no server. `runs/` has to be committed for this to
# produce anything; it is the data, not an artifact of the build.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail loudly if there is nothing to publish
        run: |
          if [ ! -f runs/index.json ]; then
            echo "No runs/index.json. The viewer has no data to show."
            echo "Record one with: npm run record -- --backend textract"
            exit 1
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp ui/index.html _site/index.html
          cp -r runs _site/runs
          # index.html resolves `runs/` relative to itself, so the page sits at the
          # site root rather than under /ui/.

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
