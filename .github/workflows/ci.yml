name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because an advisory published after the last push makes the README's
  # audit claim false without anything in the repository changing.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=moderate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The suite needs no credentials and makes no network calls, which is the
      # point: a contributor can verify every claim in the README except the
      # recorded benchmark numbers without an AWS account or an API key.
      - name: Assert the fixture generator is deterministic
        run: |
          npm run fixtures
          sha256sum fixtures/out/*.gold.json > /tmp/first.sha
          npm run fixtures
          sha256sum fixtures/out/*.gold.json > /tmp/second.sha
          diff /tmp/first.sha /tmp/second.sha
